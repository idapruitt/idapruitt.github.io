<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pattern Generator Playground</title>

<style>
body {
  font-family: system-ui, sans-serif;
  background: #543b6e;
  color: #e6e6eb;
  padding: 24px;
}
.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
button {
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #1f1f2e;
  color: #fff;
  cursor: pointer;
}
button:hover { background: #2c2c44; }

.output {
  font-size: 2rem;
  letter-spacing: 0.4rem;
  padding: 24px;
  background: #14141d;
  border-radius: 16px;
  display: flex;
  flex-wrap: wrap;
}
.symbol-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0 0.25rem;
}
.symbol { font-size: 1.2rem; }
.number { font-size: 1rem; opacity: 0.8; }

.heart { color: #ff4d6d; }
.star { color: #ffd700; }
.triangle { color: #00ffff; }
.xmark { color: #ffffff; }

.meta {
  margin-top: 10px;
  opacity: 0.65;
  font-size: 0.9rem;
}
</style>
</head>

<body>
<h1>Pattern Generator Playground</h1>
<p>Generators express intent. Classifier expresses perception.</p>

<div class="controls">
  <button onclick="run('uniform')">Uniform</button>
  <button onclick="run('alternating')">Alternating</button>
  <button onclick="run('symalt')">Symmetric Alternating</button>
  <button onclick="run('symmetric')">Symmetric</button>
  <button onclick="run('repeating')">Repeating Motif</button>
  <button onclick="run('dominant')">Dominant</button>
  <button onclick="run('chaotic')">Chaotic</button>
  <button onclick="run('equal2')">Equal 2</button>
  <button onclick="run('equal3')">Equal 3</button>
  <button onclick="run('equal4')">Equal 4</button>
  <button onclick="run('pairs')">Pairs</button>
  <button onclick="run('triples')">Triples</button>
  <button onclick="run('block')">Block</button>
</div>

<div class="output" id="output"></div>
<div class="meta" id="meta"></div>

<script>
const SYMBOLS = [
  { char:'♥', class:'heart', name:'heart' },
  { char:'★', class:'star', name:'star' },
  { char:'▲', class:'triangle', name:'tri' },
  { char:'✖', class:'xmark', name:'x' }
];

const randInt = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];} return a; };

function render(seq){
  return seq.map(i=>{
    const s=SYMBOLS[i];
    return `<div class="symbol-container">
      <span class="symbol ${s.class}">${s.char}</span>
      <span class="number">${i+1}</span>
    </div>`;
  }).join('');
}

// ================= Generators =================
const genUniform = len => Array(len).fill(randInt(0,3));

function genAlternating(len){
  if(len%2!==0) len--;
  if(len<4) len=4;
  let a=randInt(0,3), b;
  do{ b=randInt(0,3); } while(b===a);
  return Array.from({length:len},(_,i)=>i%2===0?a:b);
}

function genSymAlt(len){
  if(len%2===0) len--;
  if(len<3) len=3;
  let a=randInt(0,3), b;
  do{ b=randInt(0,3); } while(b===a);
  return Array.from({length:len},(_,i)=>i%2===0?a:b);
}

function genSymmetric(len){
  const half=Math.ceil(len/2);
  const left=Array.from({length:half},()=>randInt(0,3));
  return left.concat(left.slice(0,Math.floor(len/2)).reverse());
}

function genRepeating(len){
  const size=Math.random()<0.5?3:4;
  if(len<size*2) len=size*2;
  len=Math.floor(len/size)*size;
  const motif=Array.from({length:size},()=>randInt(0,3));
  return Array.from({length:len},(_,i)=>motif[i%size]);
}

function genDominant(len){
  const d=randInt(0,3);
  return Array.from({length:len},()=>Math.random()<0.65?d:randInt(0,3));
}

const genChaotic = len => Array.from({length:len},()=>randInt(0,3));

// ---- Equal generators (correct & final) ----
function genEqual2(){
  const reps=randInt(1,5); // 2–10
  const syms=shuffle([0,1,2,3]).slice(0,2);
  let out=[];
  for(let i=0;i<reps;i++) out.push(...syms);
  return shuffle(out);
}

function genEqual3(){
  const reps=randInt(1,3); // 3,6,9
  const syms=shuffle([0,1,2,3]).slice(0,3);
  let out=[];
  for(let i=0;i<reps;i++) out.push(...syms);
  return shuffle(out);
}

function genEqual4(){
  const reps=randInt(1,2); // 4 or 8
  let out=[];
  for(let i=0;i<reps;i++) out.push(0,1,2,3);
  return shuffle(out);
}

function genPairs(len){
  if(len%2!==0) len--;
  let out=[];
  while(out.length<len){
    const s=randInt(0,3);
    out.push(s,s);
  }
  return out;
}

function genTriples(len){
  const reps=Math.max(1,Math.floor(len/3));
  let out=[];
  for(let i=0;i<reps;i++){
    const s=randInt(0,3);
    out.push(s,s,s);
  }
  return out;
}

function genBlock(len){
  if(len<4) len=4;
  const blocks=randInt(2,Math.min(4,Math.floor(len/2)));
  let remaining=len;
  let sizes=[];
  for(let i=0;i<blocks-1;i++){
    const size=randInt(2,remaining-2*(blocks-i-1));
    sizes.push(size); remaining-=size;
  }
  sizes.push(remaining);
  const syms=shuffle([0,1,2,3]);
  let out=[];
  sizes.forEach((s,i)=>out.push(...Array(s).fill(syms[i])));
  return out;
}

// ================= Classifier =================
function classify(seq){
  const len=seq.length;
  const counts={};
  seq.forEach(c=>counts[c]=(counts[c]||0)+1);
  const unique=Object.keys(counts).length;
  const max=Math.max(...Object.values(counts));
  const tags=[];

  if(unique===1){ tags.push('uniform','dominant'); }
  else if(max/len>=0.6) tags.push('dominant');

  if(seq.join('')===seq.slice().reverse().join('')) tags.push('symmetric');

  let alt=true;
  for(let i=2;i<len;i++) if(seq[i]!==seq[i-2]){alt=false;break;}
  if(alt){
    if(len%2===0) tags.push('alternating');
    else tags.push('symalt','alternating');
  }

  [3,4].forEach(n=>{
    if(len>=n*2 && len%n===0){
      const m=seq.slice(0,n).join('');
      if(m.repeat(len/n)===seq.join('')) tags.push('repeating');
    }
  });

  if(unique===2 && Object.values(counts).every(v=>v===counts[seq[0]])) tags.push('equal2');
  if(unique===3 && Object.values(counts).every(v=>v===counts[seq[0]])) tags.push('equal3');
  if(unique===4 && Object.values(counts).every(v=>v===counts[seq[0]])) tags.push('equal4');

  let i=0,p=0,t=0;
  while(i<len){
    let c=1;
    while(i+c<len && seq[i+c]===seq[i]) c++;
    if(c>=2) p+=Math.floor(c/2);
    if(c>=3) t+=Math.floor(c/3);
    for(let n=4;n<=c;n++) tags.push(n+'inarow');
    i+=c;
  }
  if(p) tags.push(p+'pair');
  if(t) tags.push(t+'triple');

  let runs=[]; i=0;
  while(i<len){ let c=1; while(i+c<len && seq[i+c]===seq[i]) c++; runs.push(c); i+=c; }
  if(runs.every(r=>r>=2)&&unique>=2) tags.push('block');

  if(!tags.some(t=>['uniform','alternating','symalt','symmetric','repeating','dominant','equal2','equal3','equal4','block'].includes(t)))
    tags.push('chaotic');

  return {
    tags,
    symbols:[...new Set(seq.map(i=>SYMBOLS[i].name))]
  };
}

// ================= Dispatch =================
function run(type){
  let len=randInt(2,10), seq;
  switch(type){
    case 'uniform': seq=genUniform(len); break;
    case 'alternating': seq=genAlternating(len); break;
    case 'symalt': seq=genSymAlt(len); break;
    case 'symmetric': seq=genSymmetric(len); break;
    case 'repeating': seq=genRepeating(len); break;
    case 'dominant': seq=genDominant(len); break;
    case 'chaotic': seq=genChaotic(len); break;
    case 'equal2': seq=genEqual2(); break;
    case 'equal3': seq=genEqual3(); break;
    case 'equal4': seq=genEqual4(); break;
    case 'pairs': seq=genPairs(len); break;
    case 'triples': seq=genTriples(len); break;
    case 'block': seq=genBlock(len); break;
  }

  const r=classify(seq);
  output.innerHTML=render(seq);
  meta.textContent=`intent: ${type} | perceived: ${r.tags.join(', ')} | symbols: ${r.symbols.join(', ')} | length: ${seq.length}`;
}


/* ===============================
   RESPONSE GENERATOR (FULL)
   =============================== */
window.addEventListener('DOMContentLoaded', () => {

  // local symbol mapping for rendering
  const RESPONSE_SYMBOLS = [
    { char: '♥', class: 'heart', name: 'heart' },
    { char: '★', class: 'star', name: 'star' },
    { char: '▲', class: 'triangle', name: 'tri' },
    { char: '✖', class: 'xmark', name: 'x' }
  ]

  // ---------- utilities ----------
  function readCurrentSequence() {
    const nodes = document.querySelectorAll('#output .number')
    if (!nodes.length) return null
    return Array.from(nodes).map(n => Number(n.textContent) - 1)
  }

  function shuffle(arr) {
    const a = [...arr]
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1))
      ;[a[i], a[j]] = [a[j], a[i]]
    }
    return a
  }

  function choice(arr) {
    return arr[Math.floor(Math.random() * arr.length)]
  }

  // ---------- render ----------
  function renderSymbols(seq) {
    return seq.map(c => {
      const s = RESPONSE_SYMBOLS[c]
      return `
        <div class="symbol-container">
          <span class="symbol ${s.class}">${s.char}</span>
          <span class="number">${c + 1}</span>
        </div>
      `
    }).join('')
  }

  function outputResponse(seq, intent) {
    if (!seq || !seq.length) return
    const result = classify(seq) // global classifier
    document.getElementById('response-output').innerHTML = renderSymbols(seq)
    document.getElementById('response-meta').textContent =
      `intent: ${intent} | perceived: ${result.tags.join(', ')} | symbols: ${result.symbols.join(', ')} | length: ${seq.length}`
  }

  // ---------- response types ----------
  function symbolSwap(seq) {
    const unique = [...new Set(seq)]
    if (unique.length < 2) return seq.slice()
    const available = shuffle([0,1,2,3])
    const map = {}
    unique.forEach((s, i) => map[s] = available[i])
    return seq.map(s => map[s])
  }

  function randomResponse() {
    const len = Math.floor(Math.random() * 9) + 2 // 2–10
    const out = []
    for (let i = 0; i < len; i++) {
      out.push(Math.floor(Math.random() * 4))
    }
    return out
  }

  function takeover(seq) {
    if (!seq || !seq.length) return seq
    const chosen = choice(seq)
    return Array(seq.length).fill(chosen)
  }

  // ---------- button bindings ----------
  const buttonMap = {
    'resp-copy': seq => seq,
    'resp-reverse': seq => [...seq].reverse(),
    'resp-scramble': seq => shuffle(seq),
    'resp-swap': seq => symbolSwap(seq),
    'resp-random': () => randomResponse(),
    'resp-takeover': seq => takeover(seq)
  }

  Object.entries(buttonMap).forEach(([id, func]) => {
    const btn = document.getElementById(id)
    if (!btn) return
    btn.onclick = () => {
      const seq = ['resp-random'].includes(id) ? null : readCurrentSequence()
      outputResponse(func(seq), `response-${id.replace('resp-','')}`)
    }
  })

})



</script>

<hr style="margin:32px 0; opacity:0.2">

<h2>Response Generator</h2>

<div class="controls">
  <button id="resp-copy">Full Copy</button>
  <button id="resp-reverse">Reverse</button>
  <button id="resp-scramble">Scramble</button>
  <button id="resp-swap">Symbol Swap</button>
  <button id="resp-random">Random</button>
  <button id="resp-takeover">Takeover</button>
</div>

<div class="output" id="response-output"></div>
<div class="meta" id="response-meta"></div>

</body>


</html>
