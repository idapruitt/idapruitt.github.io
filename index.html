<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pattern Generator Playground</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0f0f14;
      color: #e6e6eb;
      padding: 24px;
    }
    h1 { font-size: 1.8rem; margin-bottom: 6px; }
    h2 { margin-top: 32px; font-size: 1.2rem; }
    p { opacity: 0.7; margin-bottom: 16px; }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      padding: 10px;
      border-radius: 12px;
      border: none;
      background: #1f1f2e;
      color: #fff;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:hover { background: #2c2c44; }
    button.secondary { background:#2a2a38; }

    .panel {
      background:#14141d;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 24px;
    }

    .output {
      font-size: 2rem;
      letter-spacing: 0.4rem;
      min-height: 72px;
      display: flex;
      flex-wrap: wrap;
    }

    .symbol-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0 0.2rem;
    }
    .symbol { font-size: 1.2rem; }
    .number { font-size: 0.9rem; opacity:0.7; }

    .heart { color:#ff4d6d; }
    .star { color:#ffd700; }
    .triangle { color:#00ffff; }
    .xmark { color:#ffffff; }

    .meta {
      margin-top: 8px;
      opacity: 0.6;
      font-size: 0.85rem;
    }

    .feature-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .feature {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      background:#2a2a38;
      color:#aaa;
      border:1px solid #3a3a55;
    }
    .feature.true {
      background:#1f5f3a;
      color:#c9ffe3;
      border-color:#2fa36a;
    }

    .hidden { display:none; }
    input[type=text] {
      padding:8px;
      border-radius:8px;
      border:none;
      width:220px;
    }
  </style>
</head>
<body>

<h1>Pattern Generator Playground</h1>
<p>Intent (generator) vs perception (classifier). Responses are evaluated against the original.</p>

<!-- ================= PATTERN GENERATOR ================= -->
<div class="panel">
  <h2>Pattern Generator</h2>
  <div class="controls">
    <button onclick="run('uniform')">Uniform</button>
    <button onclick="run('alternating')">Alternating</button>
    <button onclick="run('symalt')">Symmetric Alt</button>
    <button onclick="run('symmetric')">Symmetric</button>
    <button onclick="run('repeating')">Repeating</button>
    <button onclick="run('dominant')">Dominant</button>
    <button onclick="run('chaotic')">Chaotic</button>
    <button onclick="run('equal2')">Equal 2</button>
    <button onclick="run('equal3')">Equal 3</button>
    <button onclick="run('equal4')">Equal 4</button>
    <button onclick="run('pairs')">Pairs</button>
    <button onclick="run('triples')">Triples</button>
    <button onclick="run('block')">Block</button>
  </div>

  <div class="output" id="generator-output"></div>
  <div class="meta" id="generator-meta"></div>

  <div class="controls" style="margin-top:16px">
    <button onclick="respond('copy')">Respond: Copy</button>
    <button onclick="respond('reverse')">Respond: Reverse</button>
    <button onclick="respond('scramble')">Respond: Scramble</button>
    <button onclick="respond('swap')">Respond: Symbol Swap</button>
    <button onclick="respond('takeover')">Respond: Takeover</button>
  </div>
</div>

<!-- ================= RESPONSE ================= -->
<div class="panel">
  <h2>Response</h2>

  <div class="controls">
    <button class="secondary" onclick="setResponseMode('auto')">Auto Response</button>
    <button class="secondary" onclick="setResponseMode('manual')">Manual Response</button>
  </div>

  <div id="auto-response">
    <div class="output" id="response-output"></div>
    <div class="meta" id="response-meta"></div>
    <div class="feature-grid" id="response-features"></div>
  </div>

  <div id="manual-response" class="hidden">
    <input id="manual-input" type="text" placeholder="Enter digits 1–4" />
    <button onclick="submitManual()">Submit</button>
    <div class="output" id="manual-output"></div>
    <div class="meta" id="manual-meta"></div>
    <div class="feature-grid" id="manual-features"></div>
  </div>
</div>

<script>
// ================= SHARED =================
const SYMBOLS = [
  { char:'♥', class:'heart', name:'heart' },
  { char:'★', class:'star', name:'star' },
  { char:'▲', class:'triangle', name:'tri' },
  { char:'✖', class:'xmark', name:'x' }
];

const randInt=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=randInt(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;};
const choice=a=>a[randInt(0,a.length-1)];

function render(seq){
  return seq.map(i=>{
    const s=SYMBOLS[i];
    return `<div class="symbol-container"><span class="symbol ${s.class}">${s.char}</span><span class="number">${i+1}</span></div>`;
  }).join('');
}

// ================= GENERATORS =================
const genUniform=len=>Array(len).fill(randInt(0,3));
function genAlternating(len){ if(len%2)len--; if(len<4)len=4; let a=randInt(0,3),b;do{b=randInt(0,3);}while(b===a); return Array.from({length:len},(_,i)=>i%2?a:b); }
function genSymAlt(len){ if(len%2===0)len--; if(len<3)len=3; let a=randInt(0,3),b;do{b=randInt(0,3);}while(b===a); return Array.from({length:len},(_,i)=>i%2?a:b); }
function genSymmetric(len){ const h=Math.ceil(len/2); const l=Array.from({length:h},()=>randInt(0,3)); return l.concat(l.slice(0,Math.floor(len/2)).reverse()); }
function genRepeating(len){ const s=Math.random()<0.5?3:4; if(len<s*2)len=s*2; len=Math.floor(len/s)*s; const m=Array.from({length:s},()=>randInt(0,3)); return Array.from({length:len},(_,i)=>m[i%s]); }
function genDominant(len){ const d=randInt(0,3); return Array.from({length:len},()=>Math.random()<0.65?d:randInt(0,3)); }
const genChaotic=len=>Array.from({length:len},()=>randInt(0,3));
function genEqual(n){ const reps=[2,3,4][n-2]||2; let out=[]; for(let i=0;i<reps;i++) for(let j=0;j<n;j++) out.push(j); return shuffle(out); }
function genPairs(len){ if(len%2)len--; let o=[]; while(o.length<len){const s=randInt(0,3);o.push(s,s);} return o; }
function genTriples(len){ const r=Math.max(1,Math.floor(len/3)); return Array.from({length:r*3},()=>choice([0,1,2,3])); }
function genBlock(len){ if(len<4)len=4; const b=randInt(2,Math.min(4,Math.floor(len/2))); let rem=len,sizes=[]; for(let i=0;i<b-1;i++){const s=randInt(2,rem-2*(b-i-1));sizes.push(s);rem-=s;} sizes.push(rem); const syms=shuffle([0,1,2,3]); let o=[]; sizes.forEach((s,i)=>o.push(...Array(s).fill(syms[i]))); return o; }

// ================= CLASSIFIER =================
function classify(seq){
  const len=seq.length,counts={},tags=[];
  seq.forEach(c=>counts[c]=(counts[c]||0)+1);
  const uniq=Object.keys(counts).length,max=Math.max(...Object.values(counts));

  if(uniq===1){tags.push('uniform','dominant');}
  else if(max/len>=0.6) tags.push('dominant');

  if(seq.join('')===seq.slice().reverse().join('')) tags.push('symmetric');

  let alt=true; for(let i=2;i<len;i++) if(seq[i]!==seq[i-2]){alt=false;break;}
  if(alt){ tags.push('alternating'); if(len%2) tags.push('symalt'); }

  [3,4].forEach(n=>{ if(len>=n*2&&len%n===0){const m=seq.slice(0,n).join(''); if(m.repeat(len/n)===seq.join('')) tags.push('repeating'); }});

  const eq=Object.values(counts).every(v=>v===counts[seq[0]]);
  if(uniq===2&&eq)tags.push('equal2'); if(uniq===3&&eq)tags.push('equal3'); if(uniq===4&&eq)tags.push('equal4');

  let i=0; while(i<len){let c=1; while(i+c<len&&seq[i+c]===seq[i])c++; if(c>=2)tags.push('pair'); if(c>=3)tags.push('triple'); i+=c; }

  if(!tags.length) tags.push('chaotic');
  return {tags, symbols:[...new Set(seq.map(i=>SYMBOLS[i].name))]};
}

// ================= STATE =================
let currentSequence=null;
let responseMode='auto';

// ================= DISPATCH =================
function run(type){
  let len=randInt(2,10),seq;
  switch(type){
    case'uniform':seq=genUniform(len);break;
    case'alternating':seq=genAlternating(len);break;
    case'symalt':seq=genSymAlt(len);break;
    case'symmetric':seq=genSymmetric(len);break;
    case'repeating':seq=genRepeating(len);break;
    case'dominant':seq=genDominant(len);break;
    case'chaotic':seq=genChaotic(len);break;
    case'equal2':seq=genEqual(2);break;
    case'equal3':seq=genEqual(3);break;
    case'equal4':seq=genEqual(4);break;
    case'pairs':seq=genPairs(len);break;
    case'triples':seq=genTriples(len);break;
    case'block':seq=genBlock(len);break;
  }
  currentSequence=seq;
  const r=classify(seq);
  generator-output.innerHTML=render(seq);
  generator-meta.textContent=`intent: ${type} | perceived: ${r.tags.join(', ')} | symbols: ${r.symbols.join(', ')} | length: ${seq.length}`;
}

function respond(type){
  if(!currentSequence) return;
  let seq;
  switch(type){
    case'copy':seq=[...currentSequence];break;
    case'reverse':seq=[...currentSequence].reverse();break;
    case'scramble':seq=shuffle(currentSequence);break;
    case'swap':seq=currentSequence.map(()=>randInt(0,3));break;
    case'takeover':seq=Array(currentSequence.length).fill(choice(currentSequence));break;
  }
  renderResponse(seq,'response-output','response-meta','response-features');
}

function renderResponse(seq,outId,metaId,featId){
  const r=classify(seq);
  document.getElementById(outId).innerHTML=render(seq);
  document.getElementById(metaId).textContent=`perceived: ${r.tags.join(', ')} | symbols: ${r.symbols.join(', ')} | length: ${seq.length}`;
  renderFeatures(seq,featId);
}

function renderFeatures(resp,containerId){
  const orig=currentSequence||[];
  const f={
    identical: JSON.stringify(orig)===JSON.stringify(resp),
    fullSymbolMatch: new Set(orig).size===new Set(resp).size && [...new Set(orig)].every(s=>resp.includes(s)),
    allNewSymbols: resp.every(s=>!orig.includes(s)),
    patternMatch: classify(orig).tags.some(t=>classify(resp).tags.includes(t)),
    chaotic: classify(resp).tags.includes('chaotic')
  };
  const labels={identical:'identical',fullSymbolMatch:'full symbol match',allNewSymbols:'all new symbols',patternMatch:'pattern match',chaotic:'chaotic'};
  document.getElementById(containerId).innerHTML=Object.keys(labels).map(k=>`<div class="feature ${f[k]?'true':''}">${labels[k]}</div>`).join('');
}

function setResponseMode(m){
  responseMode=m;
  auto-response.classList.toggle('hidden',m!=='auto');
  manual-response.classList.toggle('hidden',m!=='manual');
}

function submitManual(){
  const val=manual-input.value.trim();
  const seq=[...val].map(c=>Number(c)-1).filter(n=>n>=0&&n<4);
  if(!seq.length||!currentSequence) return;
  renderResponse(seq,'manual-output','manual-meta','manual-features');
}
</script>
</body>
</html>
