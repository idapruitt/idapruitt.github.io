<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pattern Playground</title>
<style>
  body { font-family: system-ui; background:#111; color:#eee; padding:20px }
  button { margin:4px; padding:6px 10px; cursor:pointer }
  .seq { font-size:22px; margin:10px 0 }
  .symbols span { margin:0 6px; font-size:18px }
  .meta { font-size:14px; color:#aaa }
</style>
</head>
<body>

<h2>Generator</h2>
<button onclick="generate('equal2')">equal2</button>
<button onclick="generate('equal3')">equal3</button>
<button onclick="generate('equal4')">equal4</button>
<button onclick="generate('triple')">triple</button>
<button onclick="generate('block')">block</button>
<button onclick="generate('alternating')">alternating</button>
<button onclick="generate('symalt')">symalt</button>

<h2>Response</h2>
<button onclick="respond('copy')">copy</button>
<button onclick="respond('reverse')">reverse</button>
<button onclick="respond('scramble')">scramble</button>

<div class="seq" id="seq"></div>
<div class="symbols" id="symbols"></div>
<div class="meta" id="meta"></div>

<script>
const symbolMap = {
  1:{icon:'❤️', name:'heart'},
  2:{icon:'⭐', name:'star'},
  3:{icon:'🔺', name:'tri'},
  4:{icon:'❌', name:'x'}
}

let lastSeq = []

const rand = a => a[Math.floor(Math.random()*a.length)]

const shuffle = arr => {
  let a=[...arr]
  for(let i=a.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1))
    ;[a[i],a[j]]=[a[j],a[i]]
  }
  return a
}

/* ---------- GENERATORS ---------- */

function generate(type){
  let seq=[]
  if(type==='equal2'){
    let len=rand([2,4,6,8,10])
    let sym=rand([1,2,3,4])
    seq=Array(len).fill(sym)
  }

  if(type==='equal3'){
    let len=rand([3,6,9])
    let sym=rand([1,2,3,4])
    seq=Array(len).fill(sym)
  }

  if(type==='equal4'){
    let len=rand([4,8])
    let syms=shuffle([1,2,3,4]).slice(0,len/2)
    seq=[]
    syms.forEach(s=>seq.push(s,s))
    seq=shuffle(seq)
  }

  if(type==='triple'){
    let count=rand([1,2,3])
    let sym=rand([1,2,3,4])
    seq=Array(count*3).fill(sym)
  }

  if(type==='block'){
    let syms=shuffle([1,2,3,4]).slice(0,rand([2,3]))
    syms.forEach(s=>{
      let n=rand([2,3,4])
      for(let i=0;i<n;i++) seq.push(s)
    })
    seq=shuffle(seq)
  }

  if(type==='alternating'){
    let a=rand([1,2,3,4])
    let b=rand([1,2,3,4].filter(x=>x!==a))
    let len=rand([4,6,8,10])
    for(let i=0;i<len;i++) seq.push(i%2?a:b)
  }

  if(type==='symalt'){
    let a=rand([1,2,3,4])
    let b=rand([1,2,3,4].filter(x=>x!==a))
    let len=rand([3,5,7,9])
    for(let i=0;i<len;i++) seq.push(i%2?a:b)
  }

  lastSeq=[...seq]
  render(seq, 'generated')
}

/* ---------- RESPONSES ---------- */

function respond(type){
  if(!lastSeq.length) return
  let seq=[...lastSeq]

  if(type==='reverse') seq=seq.reverse()
  if(type==='scramble') seq=shuffle(seq)

  render(seq, 'response:'+type)
}

/* ---------- PERCEPTION ---------- */

function perceive(seq){
  let tags=[]
  let len=seq.length
  let counts={}
  seq.forEach(s=>counts[s]=(counts[s]||0)+1)

  let values=Object.values(counts)
  if(values.every(v=>v%2===0)) tags.push(`${values.reduce((a,b)=>a+b)/2}pair`)
  if(values.every(v=>v%3===0)) tags.push('triple')
  if(values.every(v>=2)) tags.push('block')

  let alt=true
  for(let i=1;i<seq.length;i++) if(seq[i]===seq[i-1]) alt=false
  if(alt) tags.push('alternating')
  if(alt && len%2===1) tags.push('symalt')

  let present=Object.keys(counts).map(k=>symbolMap[k].name)

  return {tags,len,present}
}

/* ---------- RENDER ---------- */

function render(seq, source){
  let p=perceive(seq)
  document.getElementById('seq').textContent=seq.join('')
  document.getElementById('symbols').innerHTML=
    seq.map(s=>`<span>${symbolMap[s].icon}</span>`).join('')
  document.getElementById('meta').textContent=
    `${source} | ${p.tags.join(', ')} | len:${p.len} | ${p.present.join(', ')}`
}
</script>
</body>
</html>
