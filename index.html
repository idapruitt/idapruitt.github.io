<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Pattern Generator</title>
<style>
  body {
    font-family: monospace;
    background: #347331;
    color: #eaeaf0;
    padding: 20px;
  }

  button {
    margin: 4px;
    padding: 6px 10px;
    cursor: pointer;
  }

  .output {
    margin-top: 20px;
    font-size: 20px;
  }

  .label {
    margin-top: 6px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<h2>Pattern Types</h2>

<button onclick="run('uniform')">uniform</button>
<button onclick="run('symmetric')">symmetric</button>
<button onclick="run('alternating')">alternating</button>
<button onclick="run('repeating')">repeating</button>
<button onclick="run('chaotic')">chaotic</button>

<div class="output" id="output"></div>
<div class="label" id="label"></div>

<script>
const SYMBOLS = ['1','2','3','4','5'];

function randSymbol() {
  return SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

/* =========================
   GENERATORS (NO CONSTRAINTS)
   ========================= */

function genUniform(len) {
  const s = randSymbol();
  return s.repeat(len);
}

function genSymmetric(len) {
  const half = Math.ceil(len / 2);
  let left = '';
  for (let i = 0; i < half; i++) left += randSymbol();
  const right = left.slice(0, len / 2).split('').reverse().join('');
  return left + right;
}

function genAlternating(len) {
  let a = randSymbol();
  let b = randSymbol();
  let out = '';
  for (let i = 0; i < len; i++) {
    out += (i % 2 === 0 ? a : b);
  }
  return out;
}

function genRepeating(len) {
  const motifLen = randInt(2, 3);
  let motif = '';
  for (let i = 0; i < motifLen; i++) motif += randSymbol();
  let out = '';
  while (out.length < len) out += motif;
  return out.slice(0, len);
}

function genChaotic(len) {
  let out = '';
  for (let i = 0; i < len; i++) out += randSymbol();
  return out;
}

/* =========================
   CLASSIFIER (FAST, O(n))
   ========================= */

function classify(seq) {
  const chars = seq.split('');
  const unique = new Set(chars);

  if (unique.size === 1) return 'uniform';

  const reversed = chars.slice().reverse().join('');
  if (seq === reversed) return 'symmetric';

  let alternating = true;
  for (let i = 2; i < chars.length; i++) {
    if (chars[i] !== chars[i - 2]) {
      alternating = false;
      break;
    }
  }
  if (alternating) return 'alternating';

  for (let size = 2; size <= Math.floor(chars.length / 2); size++) {
    const motif = chars.slice(0, size).join('');
    if (motif.repeat(Math.ceil(chars.length / size)).startsWith(seq)) {
      return 'repeating';
    }
  }

  return 'chaotic';
}

/* =========================
   DISPATCH
   ========================= */

function generate(type, len) {
  switch (type) {
    case 'uniform': return genUniform(len);
    case 'symmetric': return genSymmetric(len);
    case 'alternating': return genAlternating(len);
    case 'repeating': return genRepeating(len);
    case 'chaotic': return genChaotic(len);
  }
}

function run(type) {
  const len = randInt(5, 8);

  let seq = generate(type, len);
  let result = classify(seq);

  // one bounded retry if it collapses
  if (result === 'uniform' && type !== 'uniform') {
    seq = generate(type, len);
    result = classify(seq);
  }

  document.getElementById('output').textContent = seq;
  document.getElementById('label').textContent =
    `generated as: ${type} | perceived as: ${result}`;
}
</script>

</body>
</html>
