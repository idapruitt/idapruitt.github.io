<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pattern Generator Playground</title>

<style>
body {
  font-family: system-ui, sans-serif;
  background: #364021;
  color: #e6e6eb;
  padding: 24px;
}

h1, h2 {
  margin-bottom: 8px;
}

.controls {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}

button {
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #1f1f2e;
  color: #fff;
  cursor: pointer;
}

button:hover { background: #2c2c44; }

.output {
  background: #14141d;
  padding: 20px;
  border-radius: 14px;
  display: flex;
  flex-wrap: wrap;
  min-height: 64px;
  margin-bottom: 6px;
}

.symbol-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0 0.25rem;
}

.symbol { font-size: 1.3rem; }
.number { font-size: 0.9rem; opacity: 0.7; }

.heart { color: #ff4d6d; }
.star { color: #ffd700; }
.triangle { color: #00ffff; }
.xmark { color: #ffffff; }

.meta {
  opacity: 0.65;
  font-size: 0.85rem;
  margin-bottom: 14px;
}

.feature-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.feature {
  padding: 6px 12px;
  border-radius: 999px;
  font-size: 0.8rem;
  background: #2a2a38;
  color: #aaa;
  border: 1px solid #3a3a55;
}

.feature.true {
  background: #1f5f3a;
  color: #c9ffe3;
  border-color: #2fa36a;
}

.hidden { display: none; }

input {
  padding: 8px;
  border-radius: 8px;
  border: none;
  width: 220px;
}
</style>
</head>

<body>

<h1>Pattern Generator Playground</h1>

<!-- ================= GENERATOR ================= -->

<h2>Generator</h2>
<div class="controls">
  <button onclick="run('uniform')">Uniform</button>
  <button onclick="run('alternating')">Alternating</button>
  <button onclick="run('symalt')">Symmetric Alternating</button>
  <button onclick="run('symmetric')">Symmetric</button>
  <button onclick="run('repeating')">Repeating</button>
  <button onclick="run('dominant')">Dominant</button>
  <button onclick="run('chaotic')">Chaotic</button>
</div>

<div id="generator-output" class="output"></div>
<div id="generator-meta" class="meta"></div>

<!-- ================= RESPONSES ================= -->

<h2>Response</h2>

<div class="controls">
  <button onclick="setMode('auto')">Auto</button>
  <button onclick="setMode('manual')">Manual</button>
</div>

<!-- Auto response -->
<div id="auto-panel">
  <div class="controls">
    <button onclick="respond('copy')">Copy</button>
    <button onclick="respond('reverse')">Reverse</button>
    <button onclick="respond('scramble')">Scramble</button>
    <button onclick="respond('swap')">Symbol Swap</button>
    <button onclick="respond('takeover')">Takeover</button>
  </div>

  <div id="response-output" class="output"></div>
  <div id="response-meta" class="meta"></div>
</div>

<!-- Manual response -->
<div id="manual-panel" class="hidden">
  <div class="controls">
    <input id="manual-input" placeholder="Enter digits 1–4">
    <button onclick="submitManual()">Submit</button>
  </div>

  <div id="manual-output" class="output"></div>
  <div id="manual-meta" class="meta"></div>
</div>

<div id="response-features" class="feature-grid"></div>

<script>
/* ================= SYMBOLS ================= */
const SYMBOLS = [
  { char:'♥', class:'heart', name:'heart' },
  { char:'★', class:'star', name:'star' },
  { char:'▲', class:'triangle', name:'tri' },
  { char:'✖', class:'xmark', name:'x' }
]

/* ================= UTILS ================= */
const rand = (a,b)=>Math.floor(Math.random()*(b-a+1))+a
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=rand(0,i);[b[i],b[j]]=[b[j],b[i]];} return b }
const choice = a => a[rand(0,a.length-1)]

/* ================= STATE ================= */
let currentSequence = null

/* ================= RENDER ================= */
function render(seq){
  return seq.map(i=>{
    const s=SYMBOLS[i]
    return `<div class="symbol-container">
      <span class="symbol ${s.class}">${s.char}</span>
      <span class="number">${i+1}</span>
    </div>`
  }).join('')
}

/* ================= GENERATORS ================= */
const gen = {
  uniform: len => Array(len).fill(rand(0,3)),
  alternating: len => {
    if(len%2) len--
    if(len<4) len=4
    let a=rand(0,3), b; do{b=rand(0,3)}while(a===b)
    return Array.from({length:len},(_,i)=>i%2?a:b)
  },
  symalt: len => {
    if(!(len%2)) len++
    if(len<3) len=3
    let a=rand(0,3), b; do{b=rand(0,3)}while(a===b)
    return Array.from({length:len},(_,i)=>i%2?a:b)
  },
  symmetric: len => {
    const h=Math.ceil(len/2)
    const left=Array.from({length:h},()=>rand(0,3))
    return left.concat(left.slice(0,len/2).reverse())
  },
  repeating: len => {
    const n=Math.random()<0.5?3:4
    len=Math.max(len,n*2)
    len=Math.floor(len/n)*n
    const m=Array.from({length:n},()=>rand(0,3))
    return Array.from({length:len},(_,i)=>m[i%n])
  },
  dominant: len => {
    const d=rand(0,3)
    return Array.from({length:len},()=>Math.random()<0.65?d:rand(0,3))
  },
  chaotic: len => Array.from({length:len},()=>rand(0,3))
}

/* ================= CLASSIFY ================= */
function classify(seq){
  const len=seq.length
  const counts={}
  seq.forEach(s=>counts[s]=(counts[s]||0)+1)
  const unique=Object.keys(counts).length
  const max=Math.max(...Object.values(counts))
  const tags=[]

  if(unique===1){ tags.push('uniform','dominant') }
  else if(max/len>=0.6) tags.push('dominant')

  if(seq.join('')===seq.slice().reverse().join('')) tags.push('symmetric')

  let alt=true
  for(let i=2;i<len;i++) if(seq[i]!==seq[i-2]) alt=false
  if(alt){
    if(len%2) tags.push('symalt','alternating')
    else tags.push('alternating')
  }

  if(!tags.length) tags.push('chaotic')

  return { tags, symbols:[...new Set(seq.map(i=>SYMBOLS[i].name))] }
}

/* ================= RUN GENERATOR ================= */
function run(type){
  const len=rand(2,10)
  const seq=gen[type](len)
  currentSequence=seq
  const r=classify(seq)
  document.getElementById('generator-output').innerHTML=render(seq)
  document.getElementById('generator-meta').textContent=
    `intent: ${type} | perceived: ${r.tags.join(', ')} | symbols: ${r.symbols.join(', ')} | length: ${seq.length}`
}

/* ================= RESPONSES ================= */
function respond(type){
  if(!currentSequence) return
  let seq=[...currentSequence]
  if(type==='reverse') seq.reverse()
  if(type==='scramble') seq=shuffle(seq)
  if(type==='swap'){
    const u=[...new Set(seq)]
    let pool=[0,1,2,3].filter(x=>!u.includes(x))
    if(!pool.length) pool=shuffle(u)
    const map={}
    u.forEach(s=>map[s]=choice(pool))
    seq=seq.map(s=>map[s])
  }
  if(type==='takeover'){
    const s=choice(seq)
    seq=Array(seq.length).fill(s)
  }
  renderResponse(seq, type)
}

function submitManual(){
  const v=document.getElementById('manual-input').value.trim()
  const seq=[...v].map(c=>Number(c)-1).filter(n=>n>=0&&n<=3)
  if(!seq.length) return
  renderResponse(seq,'manual')
}

/* ================= RESPONSE RENDER ================= */
function renderResponse(seq, intent){
  const r=classify(seq)
  const out=intent==='manual'?'manual-output':'response-output'
  const meta=intent==='manual'?'manual-meta':'response-meta'
  document.getElementById(out).innerHTML=render(seq)
  document.getElementById(meta).textContent=
    `response: ${intent} | perceived: ${r.tags.join(', ')} | symbols: ${r.symbols.join(', ')} | length: ${seq.length}`
  renderFeatures(seq)
}

/* ================= FEATURES ================= */
function renderFeatures(resp){
  const f=evaluate(currentSequence,resp)
  const labels={
    identical:'identical',
    full:'full symbol match',
    new:'all new symbols',
    pattern:'pattern match',
    chaotic:'chaotic'
  }
  document.getElementById('response-features').innerHTML=
    Object.entries(labels).map(([k,l])=>
      `<div class="feature ${f[k]?'true':''}">${l}</div>`
    ).join('')
}

function evaluate(a,b){
  const at=classify(a).tags
  const bt=classify(b).tags
  const as=new Set(a), bs=new Set(b)
  return {
    identical:a.length===b.length&&a.every((v,i)=>v===b[i]),
    full:as.size===bs.size&&[...as].every(s=>bs.has(s)),
    new:[...bs].every(s=>!as.has(s)),
    pattern:at.some(t=>bt.includes(t)),
    chaotic:bt.includes('chaotic')
  }
}

/* ================= MODE ================= */
function setMode(m){
  document.getElementById('auto-panel').classList.toggle('hidden',m!=='auto')
  document.getElementById('manual-panel').classList.toggle('hidden',m!=='manual')
}
</script>

</body>
</html>
