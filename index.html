<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pattern Generator Playground</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #7d3cab;
      color: #e6e6eb;
      padding: 24px;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    p {
      opacity: 0.7;
      margin-bottom: 24px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    button {
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: #1f1f2e;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button:hover {
      background: #2c2c44;
    }
    .output {
      font-size: 2rem;
      letter-spacing: 0.4rem;
      padding: 24px;
      background: #14141d;
      border-radius: 16px;
      min-height: 72px;
    }
    .meta {
      margin-top: 8px;
      opacity: 0.6;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <h1>Pattern Generator Playground</h1>
  <p>Generators express intent. Classifier expresses perception. Symbols are 1–4, length 2–10.</p>

  <div class="controls">
    <button onclick="run('uniform')">Uniform</button>
    <button onclick="run('alternating')">Alternating</button>
    <button onclick="run('symmetric')">Symmetric</button>
    <button onclick="run('repeating')">Repeating Motif</button>
    <button onclick="run('dominant')">Dominant Symbol</button>
    <button onclick="run('chaotic')">Chaotic</button>
    <button onclick="run('equal2')">Equal 2 Chars</button>
    <button onclick="run('equal3')">Equal 3 Chars</button>
    <button onclick="run('equal4')">Equal 4 Chars</button>
    <button onclick="run('pairs')">Pairs</button>
    <button onclick="run('triples')">Triples</button>
  </div>

  <div class="output" id="output"></div>
  <div class="meta" id="meta"></div>

<script>
  const SYMBOLS = ['1','2','3','4'];
  function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
  function choice(arr) { return arr[randInt(0, arr.length - 1)]; }
  function shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = randInt(0, i); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

  // ================= Generators =================
  function genUniform(len) { const s = choice(SYMBOLS); return s.repeat(len); }
  function genAlternating(len) { if (len % 2 !== 0) len -= 1; if (len < 4) len = 4; const a = choice(SYMBOLS); let b; do { b = choice(SYMBOLS); } while (b === a); let out = ''; for (let i = 0; i < len; i++) out += (i % 2 === 0 ? a : b); return out; }
  function genSymmetric(len) { const half = Math.ceil(len / 2); let left = ''; for (let i = 0; i < half; i++) left += choice(SYMBOLS); const right = left.slice(0, len / 2).split('').reverse().join(''); return left + right; }
  function genRepeating(len) { const motifLen = Math.random() < 0.5 ? 3 : 4; const minLen = motifLen * 2; if (len < minLen) len = minLen; len = Math.floor(len / motifLen) * motifLen; let motif = ''; for (let i = 0; i < motifLen; i++) motif += choice(SYMBOLS); let out = ''; while (out.length < len) out += motif; return out; }
  function genDominant(len) { const dom = choice(SYMBOLS); let out = ''; for (let i = 0; i < len; i++) out += (Math.random() < 0.65 ? dom : choice(SYMBOLS.filter(s => s !== dom))); return out; }
  function genChaotic(len) { let out = ''; for (let i = 0; i < len; i++) out += choice(SYMBOLS); return out; }
  function genEqual(n) { let chars = shuffle(SYMBOLS.slice()).slice(0, n); const repeatCount = randInt(2, 3); let arr = []; for (let i = 0; i < repeatCount; i++) arr = arr.concat(chars); return shuffle(arr).join(''); }
  function genPairs(len) { if (len % 2 !== 0) len -= 1; let out = ''; while (out.length < len) { const s = choice(SYMBOLS); out += s + s; } return out.slice(0, len); }
  function genTriples(len) { let tripleCount = Math.floor(len / 3); if (tripleCount < 1) tripleCount = 1; let out = ''; for (let i = 0; i < tripleCount; i++) out += choice(SYMBOLS).repeat(3); return out; }

  // ================= Classifier =================
  function classify(seq) {
    const chars = seq.split('');
    const len = chars.length;
    const tags = [];
    const counts = {};
    for (const c of chars) counts[c] = (counts[c] || 0) + 1;
    const uniqueCount = Object.keys(counts).length;
    const maxCount = Math.max(...Object.values(counts));

    if (uniqueCount === 1) { tags.push('uniform'); tags.push('dominant'); }
    else { if (maxCount / len >= 0.6) tags.push('dominant'); }

    const reversed = chars.slice().reverse().join('');
    if (seq === reversed) tags.push('symmetric');

    let alternating = true;
    for (let i = 2; i < len; i++) { if (chars[i] !== chars[i - 2]) { alternating = false; break; } }
    if (alternating && len % 2 === 0 && len >= 4) tags.push('alternating');

    for (let size of [3, 4]) {
      if (len < size * 2) continue;
      if (len % size !== 0) continue;
      const motif = chars.slice(0, size).join('');
      if (motif.repeat(len / size) === seq) { tags.push('repeating'); break; }
    }

    const equalCounts = Object.values(counts).every(c => c === counts[chars[0]]);
    if (uniqueCount === 2 && equalCounts) tags.push('equal2');
    if (uniqueCount === 3 && equalCounts) tags.push('equal3');
    if (uniqueCount === 4 && equalCounts) tags.push('equal4');

    // Detect number of pairs and triples separately
    let i = 0;
    let pairCount = 0;
    let tripleCount = 0;
    while (i < len) {
      let count = 1;
      while (i + count < len && chars[i + count] === chars[i]) count++;
      if (count >= 2) pairCount += Math.floor(count / 2);
      if (count >= 3) tripleCount += Math.floor(count / 3);
      i += count;
    }
    if (pairCount > 0) tags.push(pairCount + 'pair');
    if (tripleCount > 0) tags.push(tripleCount + 'triple');

    if (!tags.some(t => ['uniform','alternating','symmetric','repeating','dominant','equal2','equal3','equal4','chaotic'].includes(t))) tags.push('chaotic');

    return tags;
  }

  // ================= Dispatch =================
  function run(type) {
    let len = randInt(2, 10);
    let seq;
    switch(type){
      case 'uniform': seq = genUniform(len); break;
      case 'alternating': seq = genAlternating(len); break;
      case 'symmetric': seq = genSymmetric(len); break;
      case 'repeating': seq = genRepeating(len); break;
      case 'dominant': seq = genDominant(len); break;
      case 'chaotic': seq = genChaotic(len); break;
      case 'equal2': seq = genEqual(2); break;
      case 'equal3': seq = genEqual(3); break;
      case 'equal4': seq = genEqual(4); break;
      case 'pairs': seq = genPairs(len); break;
      case 'triples': seq = genTriples(len); break;
    }
    const perceived = classify(seq);
    document.getElementById('output').textContent = seq.split('').join(' ');
    document.getElementById('meta').textContent = `intent: ${type} | perceived: ${perceived.join(', ')}`;
  }
</script>
</body>
</html>
